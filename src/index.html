<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>GundiChest</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="ld-box">
    <div class="ld-text">LOADING… <span id="ld-pct">0%</span></div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div class="ld-note" id="ld-note"></div>
  </div>
</div>

<div id="app" aria-hidden="true">
  <header class="topbar">
    <div class="logo" aria-label="GundiChest">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a016"/></linearGradient></defs>
        <path d="M6 17c0-7 5.5-11 14-11s14 4 14 11v2H6z" fill="url(#lg1)"/>
        <rect x="6" y="20.5" width="28" height="13.5" rx="2.5" fill="url(#lg1)"/>
        <rect x="6" y="18" width="28" height="3.4" fill="#7a4a08"/>
        <path d="M20 14.5a4.2 4.2 0 0 1 2.2 7.8l.9 5.2h-6.2l.9-5.2A4.2 4.2 0 0 1 20 14.5z" fill="#1b1206"/>
        <circle cx="10.5" cy="27.5" r="1.5" fill="#7a4a08"/><circle cx="29.5" cy="27.5" r="1.5" fill="#7a4a08"/>
      </svg>
      <span class="logo-word">Gundi<b>Chest</b></span>
    </div>
    <div class="top-right">
      <button class="coin-pill" id="coinPill" type="button" aria-label="Coins">
        <span class="coin-ic" aria-hidden="true"></span><span id="coinAmt">0</span>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="view-chest" data-view="chest">
      <canvas id="gl"></canvas>
      <div id="flash"></div>
      <div id="banner" aria-live="polite"></div>
      <div id="reveal" aria-live="polite"></div>
      <div class="chest-dock" id="chestDock">
        <div class="auto-group" id="autoGroup">
          <button class="ag-row" id="autoPill" type="button" role="switch" aria-checked="false">
            <span class="ap-label">Auto opening</span>
            <span class="toggle" aria-hidden="true"></span>
            <i class="ap-bar" id="autoBar" aria-hidden="true"></i>
          </button>
          <button class="ag-row" id="fastPill" type="button" role="switch" aria-checked="false">
            <span class="ap-label">Fast open</span>
            <span class="toggle" aria-hidden="true"></span>
          </button>
        </div>
        <div class="chest-ui" id="chestUi">
          <div class="chest-meta"><span id="openedCount">0</span> opened</div>
          <button class="fn-btn fn-yellow" id="btnOpen" type="button"><span>OPEN</span></button>
          <button class="fn-btn fn-grey" id="btnIndex" type="button"><span>INDEX</span></button>
        </div>
      </div>
      <button class="skip-hint" id="skipHint" type="button">TAP TO SKIP</button>
    </section>
    <section class="view" id="view-inv" data-view="inv"></section>
    <section class="view" id="view-games" data-view="games"></section>
  </main>

  <nav class="bottomnav" id="nav">
    <button type="button" data-go="chest" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5C3 6.4 6.4 4 12 4s9 2.4 9 6.5V12H3zM3 13.5h18V19a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19zm9 .8a1.6 1.6 0 0 0-.8 3v1.5h1.6v-1.5a1.6 1.6 0 0 0-.8-3z"/></svg>
      <span>Chest</span><i class="nav-badge auto" id="autoBadge"></i>
    </button>
    <button type="button" data-go="inv">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5.5A2.5 2.5 0 0 1 10.500 3h3A2.5 2.5 0 0 1 16 5.5V7h3.500A1.500 1.500 0 0 1 21 8.500v10A2.500 2.500 0 0 1 18.500 21h-13A2.500 2.500 0 0 1 3 18.500v-10A1.500 1.500 0 0 1 4.500 7zm2 0h4V5.500a.5.500 0 0 0-.5-.5h-3a.5.500 0 0 0-.5.500zm-1 5v2h6v-2z"/></svg>
      <span>Inventory</span><i class="nav-badge" id="invBadge"></i>
    </button>
    <button type="button" data-go="games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.500 3h13A2.500 2.500 0 0 1 21 5.500v13a2.500 2.500 0 0 1-2.500 2.500h-13A2.500 2.500 0 0 1 3 18.500v-13A2.500 2.500 0 0 1 5.500 3zm2.250 3.500a1.750 1.750 0 1 0 0 3.500 1.750 1.750 0 0 0 0-3.500zm8.500 0a1.750 1.750 0 1 0 0 3.500 1.750 1.750 0 0 0 0-3.500zM12 10.250a1.750 1.750 0 1 0 0 3.500 1.750 1.750 0 0 0 0-3.500zM7.750 14a1.750 1.750 0 1 0 0 3.500 1.750 1.750 0 0 0 0-3.500zm8.500 0a1.750 1.750 0 1 0 0 3.500 1.750 1.750 0 0 0 0-3.500z"/></svg>
      <span>Games</span>
    </button>
  </nav>
</div>

<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>

<!--{{ASSETS}}-->
<script>
/*{{JS}}*/
</script>
</body>
</html>
