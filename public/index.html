:root {
  /* GundiChest: black stage for the chest, violet-slate panels, chest gold as the one accent.
     Layout: fixed top bar, one view at a time, bottom nav; sheets slide up for index and settings. */
  color-scheme: dark;
  --stage: #000000;
  --s0: #0b0a10;
  --s1: #14121c;
  --s2: #1d1a28;
  --s3: #282436;
  --line: #2f2a40;
  --text: #f4f2fa;
  --muted: #9c95b2;
  --gold: #ffc531;
  --gold-deep: #e09a10;
  --violet: #b65cff;
  --win: #36dc81;
  --loss: #ff4d61;
  --c-common: #a3acb8;
  --c-uncommon: #45d86b;
  --c-rare: #3d9dff;
  --c-epic: #b65cff;
  --c-legendary: #ffc531;
  --display: 'Luckiest Guy', 'Impact', 'Haettenschweiler', 'Arial Black', sans-serif;
  --ui: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r: 14px;
  --ease: cubic-bezier(.22, .9, .25, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage); color: var(--text); font-family: var(--ui); font-size: 15px; line-height: 1.35;
  overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- loader: plain black and white ---------- */
#loader { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
#loader.done { opacity: 0; pointer-events: none; }
.ld-box { width: min(260px, 70vw); text-align: center; }
.ld-text { font-family: var(--ui); font-weight: 600; letter-spacing: .28em; font-size: 15px; font-variant-numeric: tabular-nums; }
.ld-bar { height: 2px; background: #2a2a2a; margin-top: 16px; overflow: hidden; }
.ld-bar i { display: block; height: 100%; width: 0%; background: #fff; }
.ld-note { margin-top: 14px; font-size: 13px; color: #9a9a9a; min-height: 18px; letter-spacing: .02em; }

/* ---------- shell ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; transition: opacity .5s ease; }
#app.on { opacity: 1; }
.topbar { flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; background: linear-gradient(#0d0c13, #0a0910); border-bottom: 1px solid #1b1826; z-index: 5; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 30px; height: 30px; filter: drop-shadow(0 2px 6px rgba(255, 190, 40, .35)); }
.logo-word { font-family: var(--display); font-size: 24px; letter-spacing: .5px; transform: skewX(-8deg) translateY(2px); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
.logo-word b { font-weight: 400; color: var(--gold); }
.top-right { display: flex; align-items: center; gap: 8px; }
.coin-pill { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 8px; border-radius: 18px; background: var(--s2); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.coin-pill.bump { animation: bump .35s var(--ease); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.coin-ic { width: 20px; height: 20px; border-radius: 50%; flex: none; display: inline-block; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 45%, #c97f00 100%); box-shadow: inset 0 0 0 2px rgba(120, 70, 0, .55), 0 0 0 1px rgba(0, 0, 0, .4); position: relative; }
.coin-ic::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 1.5px solid rgba(120, 70, 0, .6); }
.coin-ic.sm { width: 15px; height: 15px; } .coin-ic.sm::after { inset: 4px; border-width: 1px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; fill: #cfc9e2; }
.icon-btn:active { transform: scale(.94); }

#views { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .28s ease, transform .32s var(--ease), visibility 0s .3s; }
.view.on { opacity: 1; visibility: visible; transform: none; transition: opacity .28s ease, transform .32s var(--ease); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px 14px 22px; }
.scroll::-webkit-scrollbar { width: 0; height: 0; }

.bottomnav { flex: none; height: 62px; display: grid; grid-template-columns: repeat(3, 1fr); background: #0b0a10; border-top: 1px solid #1b1826; z-index: 5; }
.bottomnav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7d7694; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; transition: color .2s; }
.bottomnav svg { width: 24px; height: 24px; fill: currentColor; transition: transform .25s var(--ease); }
.bottomnav button.on { color: var(--gold); }
.bottomnav button.on svg { transform: translateY(-2px) scale(1.08); }
.bottomnav button.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; background: var(--gold); border-radius: 0 0 3px 3px; box-shadow: 0 0 12px rgba(255, 197, 49, .7); }
.nav-badge { position: absolute; top: 9px; left: calc(50% + 9px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--violet); color: #fff; font-size: 10.5px; font-weight: 700; font-style: normal; display: none; align-items: center; justify-content: center; letter-spacing: 0; }
.nav-badge.on { display: flex; }
.nav-badge.auto { background: var(--gold); color: #1c1407; font-weight: 800; animation: pulse 1.6s ease-in-out infinite; }
#view-inv.quiet .inv-item { animation: none; }

/* ---------- chest view ---------- */
#view-chest { background: var(--stage); overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
.chest-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.chest-ui { align-self: stretch; padding: 14px 22px 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; align-items: stretch; transition: opacity .25s ease, transform .3s var(--ease); background: linear-gradient(to top, rgba(0, 0, 0, .86) 0%, rgba(0, 0, 0, .7) 58%, rgba(0, 0, 0, 0) 100%); pointer-events: none; }
.chest-ui > * { pointer-events: auto; }
.chest-ui.hide { opacity: 0; transform: translateY(16px); }
.chest-ui.hide > * { pointer-events: none; }
/* auto opening + fast open: one glass group under the chest, always on screen, so auto can be switched off mid-run */
.auto-group { pointer-events: auto; display: flex; flex-direction: column; min-width: 216px; border-radius: 19px; background: rgba(18, 16, 27, .82); border: 1px solid rgba(255, 255, 255, .11); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); overflow: hidden; transition: border-color .25s, box-shadow .25s; }
.auto-group.on { border-color: rgba(255, 197, 49, .6); box-shadow: 0 0 0 1px rgba(255, 197, 49, .16), 0 8px 26px rgba(255, 190, 40, .2); }
.ag-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 38px; padding: 0 8px 0 16px; transition: background .15s; }
.ag-row + .ag-row { border-top: 1px solid rgba(255, 255, 255, .07); }
.ag-row:active { background: rgba(255, 255, 255, .06); }
.ag-row .ap-label { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #b9b2d0; transition: color .25s; padding-top: 1px; }
.ag-row .toggle { width: 42px; height: 24px; border-radius: 12px; background: #2e2a3e; display: block; }
.ag-row .toggle::after { width: 18px; height: 18px; }
.ag-row.on .ap-label { color: #fff; }
.ag-row.on .toggle { background: var(--gold); }
.ag-row.on .toggle::after { transform: translateX(18px); }
.ap-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gold); transform: scaleX(0); transform-origin: left center; opacity: 0; transition: transform 0s linear; }
.ap-bar.run { opacity: .95; transform: scaleX(1); }
.chest-meta { text-align: center; color: #6f6887; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; font-variant-numeric: tabular-nums; }

/* big game-style buttons */
.fn-btn { position: relative; display: block; width: 100%; max-width: 420px; align-self: center; padding: 17px 16px 11px; border-radius: 7px; font-family: var(--display); font-size: 34px; line-height: 1; letter-spacing: 1.5px; transform: skewX(-7deg); transition: transform .08s ease, box-shadow .08s ease, filter .2s; }
.fn-btn span { display: block; transform: skewX(0deg); }
.fn-yellow { color: #1d1638; background: linear-gradient(180deg, #fff65c 0%, #ffe02b 42%, #ffbf0a 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .75), inset 0 -6px 0 rgba(170, 100, 0, .38), 0 7px 0 #8f5d00, 0 14px 30px rgba(255, 196, 30, .28); text-shadow: 0 2px 0 rgba(255, 255, 255, .45); }
.fn-grey { color: #f4f5f8; background: linear-gradient(180deg, #a4abba 0%, #7b8395 45%, #5b6272 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35), inset 0 -6px 0 rgba(20, 24, 34, .35), 0 7px 0 #2e3340, 0 12px 24px rgba(0, 0, 0, .5); text-shadow: 0 2px 0 rgba(0, 0, 0, .35); font-size: 28px; padding: 14px 16px 9px; }
.fn-green { color: #07230f; background: linear-gradient(180deg, #8dff9c 0%, #3fe46a 45%, #17b84a 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), inset 0 -6px 0 rgba(0, 90, 30, .35), 0 7px 0 #0b6d2a, 0 12px 26px rgba(40, 220, 100, .22); text-shadow: 0 2px 0 rgba(255, 255, 255, .35); font-size: 26px; padding: 14px 12px 9px; }
.fn-btn:active { transform: skewX(-7deg) translateY(5px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .5), inset 0 -3px 0 rgba(0, 0, 0, .25), 0 2px 0 #5a3b00; }
.fn-btn[disabled] { filter: grayscale(.8) brightness(.6); pointer-events: none; }
.fn-btn small { display: block; font-family: var(--ui); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; margin-top: 3px; opacity: .8; }
.fn-row { display: flex; gap: 14px; }
.fn-row .fn-btn { font-size: 24px; padding: 15px 8px 9px; }
.skip-hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); color: #6c6682; font-size: 12px; letter-spacing: .2em; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s; padding: 12px 18px; }
.skip-hint.on { opacity: 1; pointer-events: auto; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* legendary banner */
#banner { position: absolute; top: 0; left: 0; right: 0; z-index: 6; pointer-events: none; }
.banner { transform: translateY(-110%); transition: transform .5s var(--ease); background: linear-gradient(90deg, rgba(60, 34, 0, 0) 0%, #2a1a00 12%, #3b2500 50%, #2a1a00 88%, rgba(60, 34, 0, 0) 100%); border-top: 2px solid #ffd34d; border-bottom: 2px solid #ffd34d; padding: 9px 16px 7px; text-align: center; overflow: hidden; position: relative; box-shadow: 0 8px 40px rgba(255, 190, 40, .35); }
.banner.on { transform: none; }
.banner::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255, 244, 190, .55), transparent); animation: sweep 2.2s ease-in-out infinite; }
@keyframes sweep { 0% { left: -40%; } 60%, 100% { left: 110%; } }
.banner .b-top { font-family: var(--display); font-size: 15px; letter-spacing: 3px; color: #ffe07a; transform: skewX(-8deg); }
.banner .b-name { font-family: var(--display); font-size: 27px; line-height: 1.05; letter-spacing: 1px; color: #fff; transform: skewX(-8deg); text-shadow: 0 0 18px rgba(255, 200, 60, .9), 0 3px 0 #7a4a00; margin-top: 2px; }
.banner .b-sub { font-size: 11.5px; letter-spacing: .16em; color: #e9c877; font-weight: 600; text-transform: uppercase; margin-top: 1px; }

/* reveal card */
#reveal { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; pointer-events: none; z-index: 4; perspective: 900px; }
#reveal.on { display: flex; }
#reveal.fast .card-wrap { animation-duration: .3s; }
#reveal.fast .rcard.flip { animation-duration: .34s; }
#reveal.fast .rcard.show .st, #reveal.fast .rcard.show .so { transition-duration: .2s; transition-delay: calc(var(--d, 0) * .28ms); }
#reveal.fast .rcard.show .ghost { transition-duration: .3s; }
#reveal.fast .rcard.show .front::after { transition-duration: .45s; transition-delay: 0s; }
.rtag { position: absolute; left: 9px; top: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 3px; border-radius: 8px; background: rgba(12, 11, 18, .88); border: 1px solid #3a3450; font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.rtag.sold { color: var(--gold); border-color: #6b5210; } .rtag.kept { color: var(--win); border-color: #1d6b40; }
#reveal.with-banner .card-wrap { margin-top: 94px; }
#reveal.with-banner .rcard { width: min(250px, 62vw, max(120px, calc((100vh - 488px) * .757))); }
.card-wrap { margin-top: 8%; transform-style: preserve-3d; animation: cardRise .7s var(--ease) both; }
@keyframes cardRise { 0% { transform: translateY(46vh) scale(.2) rotateX(50deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; opacity: 1; } }
.rcard { --rc: var(--c-common); --rd: #5b6470; width: min(250px, 62vw, max(120px, calc((100vh - 426px) * .757))); aspect-ratio: 5 / 6.6; position: relative; transform-style: preserve-3d; transform: rotateY(180deg); }
/* the turn: one even rotation with a slight lift in the middle and no bounce; the face then fills in piece by piece */
.rcard.flip { animation: cardTurn .9s cubic-bezier(.62, .02, .28, 1) both, cardLift .9s ease-in-out both; }
@keyframes cardTurn { from { transform: rotateY(180deg); } to { transform: rotateY(0deg); } }
@keyframes cardLift { 0%, 100% { scale: 1; } 50% { scale: 1.07; } }
.rcard .face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.rcard .back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 38%, var(--rc) 0%, var(--rd) 72%, #0d0b14 130%); border: 3px solid var(--rc); box-shadow: 0 0 46px rgba(0, 0, 0, .5), inset 0 0 40px rgba(0, 0, 0, .35); background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 85%, #fff) 0%, var(--rc) 28%, var(--rd) 72%, #0d0b14 130%); border: 3px solid color-mix(in srgb, var(--rc) 70%, #fff); box-shadow: 0 0 46px color-mix(in srgb, var(--rc) 65%, transparent), inset 0 0 40px rgba(0, 0, 0, .35); display: grid; place-items: center; }
.rcard .back b { font-family: var(--display); font-weight: 400; font-size: calc(var(--cw, 250px) * .48); color: rgba(255, 255, 255, .92); text-shadow: 0 6px 0 rgba(0, 0, 0, .28); transform: skewX(-6deg) translateY(10px); }
.rcard .front { background: linear-gradient(180deg, #1b1826 0%, #121019 100%); border: 3px solid var(--rc); box-shadow: 0 18px 50px rgba(0, 0, 0, .7); box-shadow: 0 0 50px color-mix(in srgb, var(--rc) 60%, transparent), 0 18px 50px rgba(0, 0, 0, .7); display: flex; flex-direction: column; }
.rcard .front::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 36%, rgba(255, 255, 255, .3) 50%, transparent 64%); transform: translateX(-130%); }
.rcard.show .front::after { transform: translateX(130%); transition: transform 1.1s cubic-bezier(.4, 0, .2, 1) .1s; }
.rcard .art { flex: 1; position: relative; background: radial-gradient(circle at 50% 42%, var(--rc) 0%, var(--rd) 66%, #17131f 115%); background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--rc) 78%, #fff) 0%, var(--rc) 22%, var(--rd) 66%, #17131f 115%); display: grid; place-items: center; overflow: hidden; }
.rcard .art::before { content: ''; position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .16) 0 9deg, transparent 9deg 18deg); animation: spin 14s linear infinite; opacity: 0; transition: opacity 1s ease; }
.rcard.show .art::before { opacity: 1; }
.rcard .art::after { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); }
.rcard.show .art::after { animation: sweep 3.2s ease-in-out 2s infinite; }
/* staged pieces: .st rises in, .so only fades; --d is the delay in ms after the card has turned */
.rcard .st { opacity: 0; transform: translateY(14px); }
.rcard.show .st { opacity: 1; transform: none; transition: opacity .6s ease, transform .75s var(--ease); transition-delay: calc(var(--d, 0) * 1ms); }
.rcard .so { opacity: 0; }
.rcard.show .so { opacity: 1; transition: opacity .5s ease; transition-delay: calc(var(--d, 0) * 1ms); }
.rcard .ghost { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--cw, 250px) * .84); line-height: 1; color: #fff; opacity: 0; transform: skewX(-6deg) translateY(14px) scale(1.2); }
.rcard.show .ghost { opacity: .15; transform: skewX(-6deg) translateY(14px) scale(1); transition: opacity .9s ease, transform 1.4s var(--ease); }
.rcard .who { position: relative; z-index: 1; max-width: 100%; padding: 0 12px; }
.rcard .who span { display: inline-block; font-family: var(--display); font-size: calc(var(--cw, 250px) * .176); line-height: 1; letter-spacing: 1px; color: #fff; white-space: nowrap; transform: skewX(-6deg) translateY(4px); text-shadow: 0 4px 0 rgba(0, 0, 0, .3), 0 0 26px rgba(255, 255, 255, .42); }
.rcard .new { position: absolute; top: 10px; right: -34px; transform: rotate(38deg); background: #fff; color: #17131f; font-weight: 800; font-size: 11px; letter-spacing: .14em; padding: 4px 40px; z-index: 2; }
.rcard .info { padding: calc(var(--cw, 250px) * .044) calc(var(--cw, 250px) * .04) calc(var(--cw, 250px) * .052); text-align: center; background: #121019; }
.rcard .rar { display: inline-block; font-family: var(--display); font-size: max(10px, calc(var(--cw, 250px) * .056)); letter-spacing: 2px; color: #14101d; background: var(--rc); padding: 4px 10px 1px; border-radius: 4px; transform: skewX(-8deg); }
.rcard .stats { display: flex; align-items: stretch; justify-content: center; gap: calc(var(--cw, 250px) * .056); margin-top: calc(var(--cw, 250px) * .04); }
.rcard .cell { min-width: calc(var(--cw, 250px) * .28); }
.rcard .cell small { display: block; font-size: max(7.5px, calc(var(--cw, 250px) * .038)); letter-spacing: .16em; text-transform: uppercase; color: #8f88a8; font-weight: 700; }
.rcard .cell b { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font-size: max(10.5px, calc(var(--cw, 250px) * .062)); font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.rcard .cell.c1 b { color: var(--rc); }
.rcard .stats i { width: 1px; background: #2c2740; }
.r-common { --rc: var(--c-common); --rd: #4d5560; } .r-uncommon { --rc: var(--c-uncommon); --rd: #17702f; } .r-rare { --rc: var(--c-rare); --rd: #1549ad; } .r-epic { --rc: var(--c-epic); --rd: #5a17a8; } .r-legendary { --rc: var(--c-legendary); --rd: #b56a00; }

/* ---------- generic UI ---------- */
.h1 { font-family: var(--display); font-size: 26px; letter-spacing: 1px; line-height: 1; transform: skewX(-7deg); transform-origin: left; margin: 2px 0 0; font-weight: 400; }
.sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--s2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: #cfc9e2; white-space: nowrap; }
.chip.on { background: var(--gold); border-color: var(--gold); color: #1c1407; }
.chip:active { transform: scale(.96); }
.btn { height: 42px; padding: 0 16px; border-radius: 11px; background: var(--s3); border: 1px solid #3a3450; font-weight: 700; font-size: 14px; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn.gold { background: linear-gradient(180deg, #ffd655, #f4ae14); color: #231700; border-color: #ffdf7a; }
.btn.green { background: linear-gradient(180deg, #55e98c, #1fbf5c); color: #052412; border-color: #7af3a8; }
.btn.red { background: linear-gradient(180deg, #ff6b7b, #e2364a); color: #fff; border-color: #ff8f9a; }
.btn.ghost { background: transparent; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.block { display: flex; width: 100%; }
.btn.big { height: 54px; font-size: 17px; border-radius: 13px; letter-spacing: .05em; text-transform: uppercase; }
.rdot { width: 9px; height: 9px; border-radius: 50%; background: var(--rc, #888); flex: none; box-shadow: 0 0 9px var(--rc, #888); }
.empty { text-align: center; color: var(--muted); padding: 46px 20px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.note { color: #6f6887; font-size: 12px; text-align: center; padding: 14px 10px 2px; }

/* ---------- sheets ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .62); opacity: 0; transition: opacity .28s ease; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet-bg.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88%; display: flex; flex-direction: column; background: var(--s0); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; transform: translateY(102%); transition: transform .38s var(--ease); box-shadow: 0 -20px 60px rgba(0, 0, 0, .6); max-width: 560px; margin: 0 auto; }
.sheet.on { transform: none; }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 18px; }
.sheet-head::before { content: ''; position: absolute; top: 7px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: #3a3450; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 14px 22px; }
.sheet-body::-webkit-scrollbar { width: 0; }
.x-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; font-size: 20px; line-height: 1; color: #cfc9e2; }

/* index */
.ix-group { margin-top: 16px; }
.ix-head { display: flex; align-items: center; gap: 10px; padding: 9px 12px 7px; border-radius: 10px 10px 0 0; background: #1c1930; border: 1px solid #2f2a40; background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 34%, #14121c), #14121c 85%); border: 1px solid color-mix(in srgb, var(--rc) 45%, #2f2a40); border-bottom: 0; position: sticky; top: -4px; z-index: 2; }
.ix-head .nm { font-family: var(--display); font-size: 19px; letter-spacing: 1.5px; color: var(--rc); transform: skewX(-7deg) translateY(2px); }
.ix-head .tot { margin-left: auto; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.ix-head .tot small { color: var(--muted); font-weight: 600; margin-left: 5px; }
.ix-list { border: 1px solid var(--line); border-radius: 0 0 10px 10px; overflow: hidden; }
.ix-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--s1); border-top: 1px solid #221e2e; }
.ix-row:first-child { border-top: 0; }
.ix-row .nm { font-weight: 600; font-size: 15px; }
.ix-row .own { font-size: 12px; color: var(--muted); font-weight: 600; }
.ix-row .own.has { color: var(--rc); }
.ix-row .ixp { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
.ix-row .ixp small { display: block; color: var(--muted); font-weight: 600; font-size: 11.5px; }
.ix-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 12px 0 4px; background: var(--s2); }
.ix-bar i { display: block; height: 100%; min-width: 3px; }
.ix-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
.ix-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 2px; border-bottom: 1px solid #1e1a2a; }
.set-row:last-child { border-bottom: 0; }
.set-row .t { font-weight: 600; } .set-row .d { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.seg { display: inline-flex; background: var(--s2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { height: 32px; padding: 0 13px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #a9a2c0; transition: background .2s, color .2s; white-space: nowrap; }
.seg button.on { background: var(--gold); color: #1c1407; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; padding: 0 4px; }
.toggle { width: 50px; height: 30px; border-radius: 15px; background: var(--s3); position: relative; transition: background .2s; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .22s var(--ease); }
.toggle.on { background: var(--gold); } .toggle.on::after { transform: translateX(20px); }
.fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
.fx-grid button { height: 42px; border-radius: 9px; font-family: var(--display); font-size: 14px; letter-spacing: .8px; color: #14101d; background: var(--rc); padding-top: 3px; }
.fx-grid button:active { transform: scale(.95); }

/* toasts */
#toasts { position: fixed; left: 0; right: 0; top: 50px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 0 10px; pointer-events: none; }
.toast { background: #221e30; border: 1px solid #3a3450; color: #fff; padding: 7px 12px; border-radius: 11px; font-weight: 700; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); animation: toastIn .3s var(--ease) both; display: flex; align-items: center; gap: 7px; max-width: min(88vw, 380px); font-variant-numeric: tabular-nums; }
.toast.out { animation: toastOut .3s ease both; }
.toast.win { border-color: var(--win); } .toast.loss { border-color: var(--loss); }
@keyframes toastIn { from { transform: translateY(-12px) scale(.9); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }

/* ---------- inventory ---------- */
.inv-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.inv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
.stat .k { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.stat .v { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 1px; display: flex; align-items: center; gap: 5px; }
.filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; margin: 0 -14px 12px; padding: 0 14px 2px; }
.filters::-webkit-scrollbar { height: 0; }
.inv-item { display: flex; align-items: center; gap: 11px; padding: 10px; background: var(--s1); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 12px; margin-bottom: 8px; animation: rowIn .3s var(--ease) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
.inv-item .av { width: 44px; height: 44px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 24px; color: #fff; padding-top: 4px; background: var(--rc); background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc) 80%, #fff), var(--rc) 40%, var(--rd)); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.inv-item .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-item .meta { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.inv-item .meta b { color: var(--rc); font-weight: 700; }
.inv-item .cnt { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; color: #fff; background: var(--s3); border-radius: 8px; padding: 2px 7px; }
.inv-acts { display: flex; gap: 6px; flex: none; }

/* ---------- games ---------- */
.game-tabs { flex: none; display: flex; gap: 7px; overflow-x: auto; padding: 10px 14px 10px; background: #0b0a10; border-bottom: 1px solid #1b1826; }
.game-tabs::-webkit-scrollbar { height: 0; }
.game-tabs button { flex: none; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 11px; background: var(--s1); border: 1px solid var(--line); color: #a9a2c0; font-weight: 700; font-size: 13.5px; transition: all .2s; }
.game-tabs button svg { width: 18px; height: 18px; fill: currentColor; }
.game-tabs button.on { background: linear-gradient(180deg, #2a2440, #1d1930); border-color: var(--gold); color: #fff; box-shadow: 0 0 0 1px rgba(255, 197, 49, .25), 0 6px 18px rgba(255, 197, 49, .12); }
.game-tabs button.on svg { fill: var(--gold); }
.game-host { flex: 1; min-height: 0; position: relative; }
.game { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px 20px; display: none; flex-direction: column; gap: 10px; }
.game::-webkit-scrollbar { width: 0; }
.game.on { display: flex; animation: gameIn .3s var(--ease) both; }
@keyframes gameIn { from { opacity: 0; transform: translateY(10px); } }
.game > * { flex: none; }
.lbl { color: var(--muted); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
.bet-in { display: flex; align-items: center; gap: 6px; background: var(--s0); border: 1px solid var(--line); border-radius: 11px; padding: 4px 4px 4px 10px; height: 46px; }
.bet-in input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: 0; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
.bet-in button { height: 36px; min-width: 42px; padding: 0 9px; border-radius: 8px; background: var(--s3); font-weight: 800; font-size: 12.5px; color: #d7d1ea; letter-spacing: .03em; }
.bet-in button:active { background: #3a3450; }
.bet.locked { opacity: .5; pointer-events: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv .stat .v { font-size: 16px; }
.result { text-align: center; font-weight: 800; font-size: 15px; min-height: 22px; }
.result.win { color: var(--win); } .result.loss { color: var(--loss); }

/* rugpull */
.rug-hist { display: flex; gap: 6px; overflow: hidden; height: 28px; align-items: center; }
.rug-hist .h { flex: none; height: 26px; padding: 0 9px; border-radius: 7px; background: var(--s1); border: 1px solid var(--line); font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; align-items: center; color: var(--loss); animation: rowIn .3s var(--ease) both; }
.rug-hist .h.g { color: var(--win); } .rug-hist .h.gold { color: var(--gold); border-color: #6b5210; }
.rug-hist .h0 { color: #6f6887; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.rug-stage { position: relative; height: 250px; border-radius: var(--r); overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #17142a 0%, #0c0b14 70%); border: 1px solid var(--line); }
.rug-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rug-mult { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 52px; line-height: 1; color: var(--win); text-shadow: 0 0 22px rgba(54, 220, 129, .55), 0 3px 0 rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums; pointer-events: none; transition: color .3s; }
.rug-mult.hot { color: #e9f05a; text-shadow: 0 0 24px rgba(233, 240, 90, .6), 0 3px 0 rgba(0, 0, 0, .5); }
.rug-mult.gold { color: var(--gold); text-shadow: 0 0 28px rgba(255, 197, 49, .8), 0 3px 0 rgba(0, 0, 0, .5); animation: goldPulse .6s ease-in-out infinite; }
@keyframes goldPulse { 50% { transform: scale(1.05); } }
.rug-mult.dead { color: var(--loss); text-shadow: 0 0 26px rgba(255, 77, 97, .7); }
.rug-play { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 7px; border: 1.5px solid var(--win); color: var(--win); background: rgba(10, 30, 18, .7); font-weight: 800; font-size: 12px; letter-spacing: .06em; white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
.rug-play.on { display: block; }
.rug-rugged { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-family: var(--display); font-size: 58px; color: #ff3b52; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255, 50, 70, .9), 0 4px 0 #5c0010; background: radial-gradient(circle at 50% 50%, rgba(255, 40, 60, .22), transparent 70%); }
.rug-rugged.on { display: flex; animation: rugIn .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes rugIn { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } }
.rug-count { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.rug-count.on { display: flex; }
.rug-count .cl { color: var(--muted); font-size: 11.5px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
.rug-count .ct { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.rug-count .bar { width: 60%; height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.rug-count .bar i { display: block; height: 100%; background: var(--win); border-radius: 3px; box-shadow: 0 0 10px rgba(54, 220, 129, .7); }
.rug-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: rgba(255, 40, 60, .45); }
.rug-flash.on { animation: rflash .5s ease-out; }
@keyframes rflash { from { opacity: 1; } to { opacity: 0; } }
.auto-row { display: flex; gap: 6px; margin-top: 8px; }
.auto-row .chip { flex: 1; justify-content: center; padding: 0 4px; }
.players .p { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid #1e1a2a; font-size: 13.5px; font-weight: 600; }
.players .p:first-of-type { border-top: 0; }
.players .p .a { width: 26px; height: 26px; border-radius: 7px; background: var(--s3); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #cfc9e2; }
.players .p .st { margin-left: auto; text-align: right; font-size: 12px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.players .p .st.c { color: var(--win); } .players .p .st.r { color: var(--loss); } .players .p .st.j { color: var(--muted); }
.players .p.me .a { background: var(--gold); color: #1c1407; }

/* chicken road */
.ck-stage { position: relative; height: 230px; border-radius: var(--r); overflow: hidden; background: #15131c; border: 1px solid var(--line); }
.ck-road { position: absolute; top: 0; bottom: 0; left: 0; display: flex; transition: transform .45s var(--ease); will-change: transform; }
.ck-lane { position: relative; width: 78px; flex: none; height: 100%; background: #23212b; border-right: 3px dashed #4a4658; }
.ck-lane.start { background: repeating-linear-gradient(135deg, #1b3a25 0 12px, #18331f 12px 24px); border-right: 4px solid #d9d4e6; width: 84px; }
.ck-lane.end { background: repeating-linear-gradient(135deg, #3a2f10 0 12px, #33290d 12px 24px); border-right: 0; width: 96px; }
.ck-lane .cap { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #4a4658, #2b2836); border: 3px solid #5a5570; display: grid; place-items: center; font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; color: #d7d1ea; transition: all .25s; }
.ck-lane.done .cap { background: radial-gradient(circle at 50% 40%, #ffe07a, #e39a12); border-color: #fff0b0; color: #2a1900; box-shadow: 0 0 18px rgba(255, 197, 49, .5); }
.ck-lane.next .cap { border-color: var(--win); color: #fff; box-shadow: 0 0 0 4px rgba(54, 220, 129, .18); animation: capPulse 1.1s ease-in-out infinite; }
@keyframes capPulse { 50% { box-shadow: 0 0 0 9px rgba(54, 220, 129, .06); } }
.ck-lane.dead .cap { background: radial-gradient(circle at 50% 40%, #ff7a88, #b01a2c); border-color: #ffc0c7; color: #fff; }
.ck-car { position: absolute; left: 50%; width: 44px; height: 76px; margin-left: -22px; top: -90px; border-radius: 10px 10px 8px 8px; background: linear-gradient(#ff5a6a, #c21f33); box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .25), 0 6px 14px rgba(0, 0, 0, .5); }
.ck-car::before { content: ''; position: absolute; left: 6px; right: 6px; top: 14px; height: 20px; border-radius: 5px; background: #1a2333; }
.ck-car::after { content: ''; position: absolute; left: 5px; right: 5px; bottom: 7px; height: 5px; border-radius: 2px; background: linear-gradient(90deg, #ffe680 0 30%, transparent 30% 70%, #ffe680 70%); }
.ck-car.b { background: linear-gradient(#5aa8ff, #1f5fc2); } .ck-car.y { background: linear-gradient(#ffd24a, #d18a00); } .ck-car.w { background: linear-gradient(#f2f2f6, #a9a9b8); }
.ck-car.go { animation: carGo var(--d, .9s) linear both; }
@keyframes carGo { from { top: -90px; } to { top: 250px; } }
.ck-car.hit { animation: carHit .42s cubic-bezier(.5, 0, 1, .6) both; }
@keyframes carHit { from { top: -90px; } to { top: 78px; } }
.ck-bird { position: absolute; left: 0; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 15px; transition: transform .28s cubic-bezier(.3, 1.5, .5, 1); z-index: 3; will-change: transform; }
.ck-bird svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .55)); }
.ck-bird.hop svg { animation: hop .28s ease-out; }
@keyframes hop { 50% { transform: translateY(-16px) scale(1.08); } }
.ck-bird.dead svg { animation: splat .4s ease-out both; }
@keyframes splat { to { transform: scale(1.3, .25) rotate(12deg); opacity: .75; } }
.ck-bird.win svg { animation: hop .4s ease-out 3; }
.ck-banner { position: absolute; left: 10px; top: 10px; padding: 5px 10px; border-radius: 8px; background: rgba(10, 9, 16, .78); border: 1px solid var(--line); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; z-index: 4; }
.ck-banner b { color: var(--gold); }

/* mines */
.mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; width: min(100%, max(250px, calc(100vh - 340px)), 460px); margin: 0 auto; }
.mt { position: relative; aspect-ratio: 1; border-radius: 11px; background: linear-gradient(180deg, #2f2a42, #252135); border: 1px solid #3b3552; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .28); transition: transform .12s, background .2s; display: grid; place-items: center; overflow: hidden; }
.mt:active { transform: scale(.94); }
.mt.live:hover { background: linear-gradient(180deg, #3a3452, #2c2740); }
.mt svg { width: 62%; height: 62%; opacity: 0; transform: scale(.3) rotate(-30deg); transition: all .3s cubic-bezier(.3, 1.6, .5, 1); }
.mt.gem { background: radial-gradient(circle at 50% 40%, #2b1d45, #171226); border-color: #6a3fb0; box-shadow: inset 0 0 22px rgba(182, 92, 255, .25); }
.mt.bomb { background: radial-gradient(circle at 50% 40%, #4a1620, #1f0b10); border-color: #b3283a; box-shadow: inset 0 0 22px rgba(255, 77, 97, .3); }
.mt.gem svg, .mt.bomb svg { opacity: 1; transform: none; }
.mt.dim { opacity: .42; }
.mt.dim svg { transform: scale(.82); }
.mt.boom { animation: boom .5s ease-out; }
@keyframes boom { 0% { transform: scale(1); } 30% { transform: scale(1.18); } 100% { transform: scale(1); } }
.mines-set { display: flex; align-items: center; gap: 8px; }
.mines-set .mc { flex: none; width: 54px; text-align: center; font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.mines-set input[type=range] { flex: 1; accent-color: #ffc531; height: 30px; }
.step { width: 40px; height: 40px; border-radius: 10px; background: var(--s3); font-size: 22px; font-weight: 700; line-height: 1; flex: none; }

/* blackjack */
.bj-table { position: relative; border-radius: var(--r); padding: 12px 10px 14px; background: radial-gradient(120% 100% at 50% 0%, #17412f 0%, #0e2a1f 55%, #0a1c15 100%); border: 1px solid #23513d; min-height: 334px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; overflow: hidden; }
.bj-table::before { content: 'BLACKJACK PAYS 3 TO 2 · DEALER STANDS ON 17'; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 10px; letter-spacing: .2em; color: rgba(255, 255, 255, .16); font-weight: 700; pointer-events: none; }
.bj-hand { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.bj-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: rgba(255, 255, 255, .6); display: flex; align-items: center; gap: 7px; }
.bj-label b { min-width: 28px; text-align: center; padding: 2px 7px; border-radius: 9px; background: rgba(0, 0, 0, .4); color: #fff; font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.bj-label b.bust { background: var(--loss); } .bj-label b.bj { background: var(--gold); color: #231700; } .bj-label b.w { background: var(--win); color: #052412; }
.bj-cards { display: flex; justify-content: center; min-height: 96px; padding-left: 26px; }
.pc { width: 66px; height: 94px; border-radius: 8px; margin-left: -26px; position: relative; transform-style: preserve-3d; animation: deal .34s var(--ease) both; flex: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .45)); }
@keyframes deal { from { transform: translate(120px, -160px) rotate(25deg); opacity: 0; } }
.pc .f, .pc .bk { position: absolute; inset: 0; border-radius: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .4s var(--ease); }
.pc .f { background: #fbfaf7; color: #17131f; padding: 5px 7px; font-weight: 800; font-size: 19px; line-height: 1; display: flex; flex-direction: column; }
.pc .f small { font-size: 15px; margin-top: 1px; }
.pc .f .big { position: absolute; right: 7px; bottom: 5px; font-size: 34px; }
.pc.red .f { color: #d81f3a; }
.pc .bk { background: repeating-linear-gradient(45deg, #5b2bb5 0 6px, #4a2196 6px 12px); border: 3px solid #f4f2fa; transform: rotateY(180deg); }
.pc.down .f { transform: rotateY(180deg); } .pc.down .bk { transform: rotateY(0deg); }
.bj-hands { display: flex; justify-content: center; gap: 16px; }
.bj-hands .bj-hand.act .bj-label { color: var(--gold); }
.bj-hands .bj-hand.dimh { opacity: .55; }
.bj-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); padding: 8px 16px 4px; border-radius: 10px; background: rgba(8, 8, 12, .9); border: 2px solid var(--gold); font-family: var(--display); font-size: 23px; letter-spacing: 1px; white-space: nowrap; opacity: 0; transition: all .3s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; z-index: 3; }
.bj-msg.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.bj-msg.win { border-color: var(--win); color: var(--win); } .bj-msg.loss { border-color: var(--loss); color: var(--loss); } .bj-msg.push { border-color: #cfc9e2; color: #fff; }
.bj-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.bj-acts .btn { padding: 0 4px; height: 54px; }

/* coinflip */
.cf-stage { position: relative; height: 240px; border-radius: var(--r); background: radial-gradient(90% 90% at 50% 40%, #241c3a 0%, #100e19 75%); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; perspective: 800px; }
.cf-coin { width: 132px; height: 132px; position: relative; transform-style: preserve-3d; }
.cf-coin .s { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: inset 0 0 0 7px rgba(255, 255, 255, .22), inset 0 -10px 20px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .5); }
.cf-coin .s svg { width: 60%; height: 60%; }
.cf-coin .hd { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 45%, #b87400 100%); }
.cf-coin .tl { background: radial-gradient(circle at 35% 30%, #f0d9ff, #b65cff 45%, #5a17a8 100%); transform: rotateY(180deg); }
.cf-shadow { width: 110px; height: 16px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .6), transparent); margin-top: -4px; }
.cf-streak { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.cf-streak i { width: 20px; height: 20px; border-radius: 50%; display: block; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 55%, #b87400); animation: rowIn .25s var(--ease) both; }
.cf-streak i.t { background: radial-gradient(circle at 35% 30%, #f0d9ff, #b65cff 55%, #5a17a8); }
.cf-mult { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cf-mult b { color: var(--gold); font-size: 17px; }
.cf-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cf-pick button { height: 60px; border-radius: 13px; background: var(--s1); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: .08em; transition: all .2s; }
.cf-pick button i { width: 30px; height: 30px; border-radius: 50%; display: block; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 55%, #b87400); }
.cf-pick button.t i { background: radial-gradient(circle at 35% 30%, #f0d9ff, #b65cff 55%, #5a17a8); }
.cf-pick button.on { border-color: var(--gold); background: #231d33; box-shadow: 0 0 0 3px rgba(255, 197, 49, .15); }
.cf-pick button.t.on { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(182, 92, 255, .18); }
.cf-pick.locked { opacity: .55; pointer-events: none; }

@media (min-width: 700px) {
  .scroll, .game { padding-left: calc(50% - 300px); padding-right: calc(50% - 300px); }
  .filters { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .game-tabs { justify-content: center; }
  .chest-ui { padding-bottom: 26px; }
}
@media (max-height: 640px) {
  .fn-btn { font-size: 28px; padding: 13px 12px 8px; } .fn-grey { font-size: 23px; padding: 11px 12px 7px; }
  .chest-ui { gap: 11px; padding: 10px 22px 12px; }
  .ag-row { height: 33px; }
  .rcard { width: min(250px, 62vw, max(120px, calc((100vh - 376px) * .757))); }
  #reveal.with-banner .rcard { width: min(250px, 62vw, max(120px, calc((100vh - 440px) * .757))); }
  .card-wrap { margin-top: 5%; }
  #reveal.with-banner .card-wrap { margin-top: 84px; }
  .bj-table { min-height: 300px; }
}
@media (prefers-reduced-motion: reduce) {
  .view, .sheet, .sheet-bg, .rcard, .ck-road { transition-duration: .01s !important; }
  .rcard .art::before, .banner::after, .rug-mult.gold { animation: none !important; }
}

/* ---------- auto opening: rules sheet and run overview ---------- */
.sheet-foot { flex: none; padding: 10px 14px 16px; border-top: 1px solid #1e1a2a; background: var(--s0); }
.as-sum { text-align: center; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 9px; font-variant-numeric: tabular-nums; }
.as-sum b { color: #fff; font-weight: 700; }
.as-presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
.as-group { background: var(--s1); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 12px; padding: 10px 10px 10px 12px; margin-bottom: 9px; }
.as-head { display: flex; align-items: center; gap: 10px; }
.as-head .nm { font-family: var(--display); font-size: 17px; letter-spacing: 1px; color: var(--rc); line-height: 1.1; padding-top: 2px; }
.as-head .d { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.seg.ks button { min-width: 54px; }
.seg.ks button.on.keep { background: var(--win); color: #052412; }

// Inventory: list, filters, selling ------------------------------------------------------------------
var Inventory = (function () {
  var root, filter = 'all', dirty = true, shownKey = '', liveTimer = 0;
  function totals() {
    var n = 0, val = 0, kinds = 0, inv = Store.s.inv;
    for (var id in inv) { n += inv[id]; val += inv[id] * ITEM_BY_ID[id].sell; kinds++; }
    return { n: n, val: val, kinds: kinds };
  }
  // howMany(item, count) -> number of copies to sell
  function sellMany(howMany, label) {
    var inv = Store.s.inv, plan = [], gain = 0, cnt = 0;
    Object.keys(inv).forEach(function (id) {
      var n = Math.min(inv[id], Math.max(0, howMany(ITEM_BY_ID[id], inv[id]) | 0));
      if (n > 0) { plan.push([id, n]); cnt += n; gain += n * ITEM_BY_ID[id].sell; }
    });
    if (!cnt) { UI.toast('Nothing to sell'); Sfx.deny(); return; }
    UI.confirm(label, 'Sell ' + fmt(cnt) + ' item' + (cnt > 1 ? 's' : '') + ' for ' + fmt(gain) + ' coins?', 'Sell').then(function (ok) {
      if (!ok) return;
      var got = 0;
      plan.forEach(function (p) { got += Store.sell(p[0], p[1]); });
      Sfx.coin(5); UI.toast('<span class="coin-ic sm"></span> +' + fmt(got), 'win');
    });
  }
  function render(live) {
    if (!root) return;
    dirty = false;
    var key = filter + '|' + JSON.stringify(Store.s.inv) + '|' + Object.keys(Store.s.found).length;
    if (live && key === shownKey) return;          // e.g. a pull that auto opening sold straight away
    shownKey = key;
    root.classList.toggle('quiet', !!live);
    var T = totals(), inv = Store.s.inv;
    var html = '<div class="scroll">' +
      '<div class="inv-top"><div><h1 class="h1">Inventory</h1><div class="sub" style="margin-top:6px">Sell what you pull to get coins for the games.</div></div></div>' +
      '<div class="inv-stats"><div class="stat"><div class="k">Items</div><div class="v">' + fmt(T.n) + '</div></div>' +
      '<div class="stat"><div class="k">Worth</div><div class="v"><span class="coin-ic sm"></span>' + fmtShort(T.val) + '</div></div>' +
      '<div class="stat"><div class="k">Found</div><div class="v">' + Object.keys(Store.s.found).length + '/' + ITEMS.length + '</div></div></div>';
    if (!T.n) {
      html += '<div class="empty"><b>Nothing here yet</b>Open a chest and your pulls land here.<div style="margin-top:16px"><button class="btn gold" type="button" id="invGo">Open a chest</button></div></div></div>';
      root.innerHTML = html;
      onTap($('#invGo', root), function () { Sfx.click(); UI.go('chest'); });
      return;
    }
    html += '<div class="filters" id="invFilters"><button type="button" class="chip' + (filter === 'all' ? ' on' : '') + '" data-f="all">All</button>' +
      RARITY_ORDER.map(function (k) { return '<button type="button" class="chip' + (filter === k ? ' on' : '') + '" data-f="' + k + '"><i class="rdot" style="--rc:' + RARITY[k].color + '"></i>' + RARITY[k].name + '</button>'; }).join('') + '</div>' +
      '<div class="row" style="margin-bottom:12px"><button class="btn sm grow" type="button" id="sellDupes">Sell duplicates</button><button class="btn sm grow" type="button" id="sellCommon">Sell commons</button><button class="btn sm grow red" type="button" id="sellAll">Sell all</button></div><div id="invList">';
    var shown = 0;
    ITEMS.forEach(function (it) {
      var n = inv[it.id]; if (!n) return;
      if (filter !== 'all' && it.rarity !== filter) return;
      shown++;
      var R = RARITY[it.rarity], last = it.name.split(' ').pop();
      html += '<div class="inv-item r-' + it.rarity + '" style="animation-delay:' + Math.min(shown * 18, 240) + 'ms"><div class="av">' + esc(last.charAt(0)) + '</div>' +
        '<div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="meta"><b>' + R.name + '</b><span>' + fmtPct(it.chance) + '</span><span class="cnt">×' + n + '</span></div></div>' +
        '<div class="inv-acts"><button class="btn sm" type="button" data-sell="' + it.id + '" data-n="1"><span class="coin-ic sm"></span>' + fmtShort(it.sell) + '</button>' +
        (n > 1 ? '<button class="btn sm gold" type="button" data-sell="' + it.id + '" data-n="' + n + '">All ' + fmtShort(it.sell * n) + '</button>' : '') + '</div></div>';
    });
    if (!shown) html += '<div class="empty"><b>No ' + RARITY[filter].name.toLowerCase() + ' items</b>Try another filter.</div>';
    html += '</div><div class="note">Selling is instant and final.</div></div>';
    var sc = $('.scroll', root), top = sc ? sc.scrollTop : 0;
    root.innerHTML = html;
    $('.scroll', root).scrollTop = top;
    $$('#invFilters .chip', root).forEach(function (c) { onTap(c, function () { Sfx.click(); filter = c.dataset.f; render(); }); });
    $$('[data-sell]', root).forEach(function (b) {
      onTap(b, function () {
        var id = b.dataset.sell, n = +b.dataset.n, g = Store.sell(id, n);
        if (g) { Sfx.coin(Math.min(n, 4)); UI.toast('<span class="coin-ic sm"></span> +' + fmt(g), 'win', 1300); }
      });
    });
    onTap($('#sellDupes', root), function () { sellMany(function (it, n) { return n - 1; }, 'Sell duplicates'); });
    onTap($('#sellCommon', root), function () { sellMany(function (it, n) { return it.rarity === 'common' ? n : 0; }, 'Sell commons'); });
    onTap($('#sellAll', root), function () { sellMany(function (it, n) { return n; }, 'Sell everything'); });
  }
  return {
    init: function () {
      root = $('#view-inv');
      Store.on(function (what) {
        if (what !== 'inv') return;
        if (UI.view !== 'inv') { dirty = true; return; }
        clearTimeout(liveTimer); liveTimer = setTimeout(function () { render(true); }, 120);     // grant + sell arrive as two events
      });
      UI.onView(function (v) { if (v === 'inv') render(); });
    }
  };
})();

// Auto opening: the rules sheet (what to keep, what to sell) and the overview of a finished run -------

        onTap(b, function () {

      if (!st.on || st.busy) return;
      st.busy = true; paint();
      var res = rand() < 0.5 ? 'h' : 't';
      var cur = st.rot, turns = 5 + randInt(3), target = Math.ceil(cur / 360) * 360 + turns * 360 + (res === 't' ? 180 : 0);
      st.rot = target; Sfx.flip();
      var dur = reducedMotion ? 300 : 1500;
      $('#cfMult', pane).innerHTML = 'Flipping…';
      try {
        coin.animate([{ transform: 'translateY(0) rotateY(' + cur + 'deg)' }, { transform: 'translateY(-78px) rotateY(' + (cur + (target - cur) * 0.55) + 'deg) scale(1.12)', offset: 0.45 }, { transform: 'translateY(0) rotateY(' + target + 'deg)' }], { duration: dur, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' });
        $('#cfShadow', pane).animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.55)', opacity: .45, offset: 0.45 }, { transform: 'scale(1)', opacity: 1 }], { duration: dur, easing: 'ease-in-out' });
      } catch (e) { coin.style.transform = 'rotateY(' + target + 'deg)'; }
      setTimeout(function () {
        st.busy = false; st.hist.push(res);
        if (res === side) {
          st.streak += 1; Sfx.win(st.streak >= 3); haptic(20);
          $('#cfMult', pane).innerHTML = (res === 'h' ? 'Crown' : 'Gem') + ' · you are at <b>' + fmtMult(mult(st.streak)) + '</b>';
          if (st.streak >= MAXS) { cash(); return; }
        } else {
          Sfx.lose(); haptic([50, 30, 80]);
          $('#cfMult', pane).innerHTML = (res === 'h' ? 'Crown' : 'Gem') + ' · <b style="color:var(--loss)">-' + fmt(st.bet) + '</b>';
          UI.toast('Wrong side · -' + fmt(st.bet), 'loss', 1500);
          st.on = false; st.streak = 0;
        }
        paint();
      }, dur + 40);
    }
    function cash() {
      if (!st.on || !st.streak || st.busy) return;
      var m = mult(st.streak), win = Math.floor(st.bet * m);
      Games.payout(win, m, fmtMult(m)); Sfx.coin(4); haptic(30);
      $('#cfMult', pane).innerHTML = 'Cashed out <b>+' + fmt(win) + '</b>';
      st.on = false; st.streak = 0; paint();
    }
    $$('#cfPick button', pane).forEach(function (b) {
      onTap(b, function () { if (st.busy) return; Sfx.click(); side = b.dataset.s; $$('#cfPick button', pane).forEach(function (x) { x.classList.toggle('on', x === b); }); });
    });
    paint();
    GC.flip = { get st() { return st; }, start: start, flip: flip, cash: cash, mult: mult };
    return {};
  }
});

// ---- 99_main.js
// Boot ------------------------------------------------------------------------------------------------
(function () {
  Store.load();
  Sfx.setEnabled(Store.s.settings.sound);
  var pctEl = $('#ld-pct'), fill = $('#ld-fill'), shown = 0, target = 0, finished = false;
  function setP(p) { target = Math.max(target, p); }
  (function anim() {
    shown += Math.max(0.004, (target - shown) * 0.16); if (shown > target) shown = target;
    var v = Math.round(shown * 100); pctEl.textContent = v + '%'; fill.style.width = v + '%';
    if (finished && v >= 100) { done(); return; }
    requestAnimationFrame(anim);
  })();
  function done() {
    $('#app').classList.add('on'); $('#app').removeAttribute('aria-hidden');
    setTimeout(function () { $('#loader').classList.add('done'); GC.ready = true; }, 260);
    setTimeout(function () { var l = $('#loader'); if (l) l.remove(); }, 1200);
  }
  UI.initShell();
  onTap($('#btnSettings'), function () { Sfx.click(); SettingsSheet.open(); });
  Inventory.init();
  Games.init();
  document.addEventListener('pointerdown', function unlock() { Sfx.unlock(); document.removeEventListener('pointerdown', unlock); }, { passive: true });

  // quality: what the user picked, else what this device settled on last time, else a guess
  var quality = Store.s.settings.quality || Store.s.settings.autoQ || ((navigator.hardwareConcurrency || 4) >= 6 || /iPhone|iPad/.test(navigator.userAgent) ? 'high' : 'mid');
  Chest3D.load(setP).then(function () {
    Chest3D.init($('#gl'), quality, setP);
    ChestView.init();
    $('#view-chest').classList.add('on');
    Chest3D.resize();
    Chest3D.start();
    // steps the effects down when the device cannot hold the frame rate (never overrides a choice made in Settings)
    var slow = 0;
    Chest3D.hooks.onFps = function (fps) {
      if (Store.s.settings.quality || UI.view !== 'chest') { slow = 0; return; }
      if (fps < (Chest3D.state === 'idle' ? 26 : 21)) slow++; else slow = 0;
      if (slow >= 2 && Chest3D.quality !== 'low') {
        var q = Chest3D.quality === 'high' ? 'mid' : 'low'; slow = 0;
        Chest3D.setQuality(q); Store.set('autoQ', q); UI.toast('Effects set to ' + q + ' for a smoother chest');
      }
    };
    window.addEventListener('resize', function () { Chest3D.resize(); });
    setP(1); finished = true;
  }).catch(function (e) {
    $('#ld-note').textContent = 'The 3D chest could not load. Check your connection and reopen the page.';
    try { console.error(e); } catch (er) {}
  });
  GC.chest = Chest3D; GC.store = Store; GC.ui = UI; GC.view = ChestView; GC.games = Games; GC.items = ITEMS; GC.roll = rollItem;
})();

})();

</script>
